name: Setup Talvia
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Create backend structure
        run: |
          mkdir -p backend/src/{config,routes,middleware,utils}
          mkdir -p frontend/src/{pages,components,store,types}
      - name: Create all files
        run: |
          # Backend files
          cat > backend/package.json << 'EOF'
          {"name":"talvia-backend","version":"1.0.0","type":"module","scripts":{"dev":"tsx watch src/server.ts","build":"tsc","start":"node dist/server.js"},"dependencies":{"express":"^4.18.2","pg":"^8.11.3","jsonwebtoken":"^9.1.2","cors":"^2.8.5","dotenv":"^16.3.1","multer":"^1.4.5-lts.1","aws-sdk":"^2.1555.0","axios":"^1.6.5","bcryptjs":"^2.4.3","passport":"^0.7.0","passport-google-oauth20":"^2.0.0"},"devDependencies":{"typescript":"^5.3.3","@types/node":"^20.10.6","@types/express":"^4.17.21","tsx":"^4.7.0"}}
          EOF
          # Frontend files
          cat > frontend/package.json << 'EOF'
          {"name":"talvia-frontend","version":"1.0.0","type":"module","scripts":{"dev":"vite","build":"tsc -b && vite build","preview":"vite preview","start":"vite preview --port 5173"},"dependencies":{"react":"^18.2.0","react-dom":"^18.2.0","react-router-dom":"^6.20.1","axios":"^1.6.5","zustand":"^4.4.7"},"devDependencies":{"@types/react":"^18.2.43","@types/react-dom":"^18.2.17","@vitejs/plugin-react":"^4.2.1","typescript":"^5.3.3","vite":"^5.0.8"}}
          EOF
      - name: Commit files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Initialize Talvia structure" || echo "No changes"
          git push || echo "Nothing to push"
